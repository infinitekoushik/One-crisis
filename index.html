<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ONE</title>
<meta name="description" content="The crises the world is ignoring right now, ranked by how little anyone is talking about them. Built only on free public data.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.124.0/Build/Cesium/Widgets/widgets.css">
<style>
*{box-sizing:border-box;border-radius:0}
html,body{margin:0;height:100%;background:#000;color:#e9e6df;overflow:hidden}
body{font:16px/1.55 'Iowan Old Style','Palatino Linotype',Georgia,serif}
.mono{font-family:ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:12px;color:#8a8780}
#globe{position:fixed;inset:0}
.cesium-viewer-bottom{opacity:.55}
#top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:16px 20px;pointer-events:none}
#top>*{pointer-events:auto}
button{font:inherit;background:#000;color:#e9e6df;border:1px solid #e9e6df;padding:8px 14px;cursor:pointer}
button:hover,button:focus-visible{background:#e9e6df;color:#000;outline:none}
#spot{position:fixed;left:20px;bottom:36px;width:min(440px,calc(100% - 40px));max-height:70vh;overflow:auto;background:rgba(0,0,0,.84);border:1px solid #3a3935;padding:18px}
#no{font-size:clamp(30px,6vw,56px);line-height:1;color:#f0a93b;font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;letter-spacing:.02em}
h1{font-weight:400;font-size:clamp(28px,5vw,44px);line-height:1.1;margin:10px 0 8px}
#txt{margin:0 0 14px;max-width:62ch}
.fig{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #3a3935;padding:8px 0}
.fig b{font-weight:400;font-size:18px}
.fig .mono{display:block}
a{color:#e9e6df}
#act{margin-top:12px;border-top:1px solid #e9e6df;padding-top:10px}
#board{position:fixed;inset:0;background:rgba(0,0,0,.97);overflow:auto;padding:64px 20px 48px}
#board[hidden]{display:none}
#board h2{font-weight:400;font-size:28px;margin:0 0 4px}
table{width:100%;border-collapse:collapse;margin-top:18px;min-width:620px}
th{text-align:left;font-weight:400;padding:6px 8px 6px 0;border-bottom:1px solid #e9e6df}
td{padding:10px 8px 10px 0;border-bottom:1px solid #3a3935;vertical-align:top}
tr.row{cursor:pointer}tr.row:hover td{background:#14130f}
td small{display:block}
#foot{position:fixed;left:20px;bottom:10px}
@media(max-width:600px){#spot{bottom:30px;max-height:55vh}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body>
<div id="globe"></div>
<div id="top"><span class="mono">ONE / onecrisis.earth</span><button id="bt" type="button">Silence Index</button></div>
<section id="spot" aria-live="polite">
 <div id="no">#0000000</div><h1 id="name">Loading</h1><p id="txt"></p>
 <div id="figs"></div><div id="act"></div>
</section>
<section id="board" hidden>
 <button id="bx" type="button" style="position:fixed;top:16px;right:20px">Close</button>
 <h2>Silence Index</h2>
 <p class="mono" id="meth" style="max-width:70ch"></p>
 <table><thead><tr><th>Rank</th><th>Crisis</th><th>Silence</th><th>Need</th><th>Unfunded</th><th>News, 7 days</th></tr></thead><tbody id="rows"></tbody></table>
</section>
<div id="foot" class="mono"></div>
<script>window.CESIUM_BASE_URL='https://cdn.jsdelivr.net/npm/cesium@1.124.0/Build/Cesium/';</script>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.124.0/Build/Cesium/Cesium.js"></script>
<script>
const WORLD='https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@master/geojson/ne_50m_admin_0_countries.geojson';
const AMBER=Cesium.Color.fromCssColorString('#f0a93b');
const $=id=>document.getElementById(id);
const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const safe=u=>/^https:\/\//.test(u||'');
Cesium.Ion.defaultAccessToken='';
const viewer=new Cesium.Viewer('globe',{
 baseLayer:new Cesium.ImageryLayer(new Cesium.UrlTemplateImageryProvider({url:'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',maximumLevel:17,credit:'Imagery: Esri, Maxar, Earthstar Geographics'})),
 baseLayerPicker:false,geocoder:false,homeButton:false,sceneModePicker:false,navigationHelpButton:false,
 animation:false,timeline:false,fullscreenButton:false,infoBox:false,selectionIndicator:false});
viewer.scene.backgroundColor=Cesium.Color.BLACK;
const ctl=viewer.scene.screenSpaceCameraController;
function release(){viewer.camera.cancelFlight();viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
 ctl.enableInputs=ctl.enableRotate=ctl.enableZoom=ctl.enableTilt=ctl.enableLook=true;
 ctl.minimumZoomDistance=150000;ctl.maximumZoomDistance=4e7}
['pointerdown','wheel','touchstart'].forEach(e=>viewer.canvas.addEventListener(e,release,{passive:true}));
release();

let world,layer;
async function highlight(iso){
 if(layer){viewer.dataSources.remove(layer,true);layer=null}
 world=world||await (await fetch(WORLD)).json();
 const f=world.features.filter(x=>[x.properties.ISO_A3_EH,x.properties.ADM0_A3,x.properties.ISO_A3].includes(iso));
 if(!f.length)return null;
 layer=await Cesium.GeoJsonDataSource.load({type:'FeatureCollection',features:f},{fill:AMBER.withAlpha(.3),clampToGround:true});
 layer.entities.values.slice().forEach(e=>{if(!e.polygon)return;const p=e.polygon.hierarchy.getValue().positions;
  layer.entities.add({polyline:{positions:p.concat(p[0]),width:2.5,clampToGround:true,material:AMBER}})});
 viewer.dataSources.add(layer);return layer}

let seq=0;
async function focus(c){
 const me=++seq;fill(c);
 try{const l=await highlight(c.iso3);
  if(l&&me===seq)await viewer.flyTo(l,{duration:3.5,offset:new Cesium.HeadingPitchRange(0,Cesium.Math.toRadians(-90),0)})}
 catch(e){console.warn('fly-in failed',e)}
 if(me===seq)release()}

function fig(label,f){
 const r=h('div','fig'),l=h('div');l.append(h('span',null,label));
 const v=h('div');v.style.textAlign='right';
 if(f&&f.value!=null){v.append(h('b',null,f.value));v.append(h('span','mono',f.source+', '+f.date))}
 else v.append(h('span','mono','no data yet'));
 r.append(l,v);return r}
function fill(c){
 $('no').textContent='#'+String(c.no).padStart(7,'0');
 $('name').textContent=c.title||c.country;$('txt').textContent=c.text||'';
 const F=$('figs');F.replaceChildren(fig('Silence score',c.score!=null?{value:c.score+' of 100',source:'ONE method',date:window.DATA.updated}:null),
  fig('Need',c.need),fig('Unfunded',c.gap),fig('News volume, 7 days',c.media));
 const A=$('act');A.replaceChildren();
 if(c.action&&safe(c.action.url)&&c.action.verified){const a=h('a',null,c.action.label);a.href=c.action.url;a.rel='noopener';a.target='_blank';
  A.append(h('span','mono','What you can do. Link checked '+c.action.verified),h('br'),a)}
 else A.append(h('span','mono','Action for this crisis is not verified yet, so we show none.'))}

function board(d){
 const rows=$('rows');rows.replaceChildren();
 [...d.crises].sort((a,b)=>(b.score??-1)-(a.score??-1)).forEach((c,i)=>{
  const tr=h('tr','row');tr.tabIndex=0;
  const cell=(f)=>{const td=h('td');if(f&&f.value!=null){td.append(h('div',null,f.value),h('small','mono',f.source+', '+f.date))}else td.append(h('span','mono','no data yet'));return td};
  tr.append(h('td','mono',i+1),h('td',null,c.country),h('td',null,c.score!=null?c.score:'-'),cell(c.need),cell(c.gap),cell(c.media));
  const go=()=>{$('board').hidden=true;focus(c)};tr.onclick=go;tr.onkeydown=e=>{if(e.key==='Enter')go()};rows.append(tr)})}

(async()=>{
 const d=window.DATA=await (await fetch('data.json?'+Date.now())).json();
 $('meth').textContent=d.method||'';
 $('foot').textContent=d.updated?'Data updated '+d.updated+'. Sources: OCHA FTS, GDELT, ReliefWeb. Basemap: Esri.':'Waiting for the first data run. Basemap: Esri.';
 board(d);
 const c=d.crises.find(x=>x.iso3===d.spotlight)||d.crises[0];
 if(c)focus(c);else{$('name').textContent='No crises loaded'}
})();
$('bt').onclick=()=>$('board').hidden=false;$('bx').onclick=()=>$('board').hidden=true;
addEventListener('keydown',e=>{if(e.key==='Escape')$('board').hidden=true});
</script></body></html>
