<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ONE</title>
<meta name="description" content="Every day, one crisis the world is ignoring. Real data, real places.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.124.0/Build/Cesium/Widgets/widgets.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;border-radius:0}
:root{--bg:#0b0b0b;--fg:#ece8df;--red:#e2231a;--dim:#6b6b6b;--line:#242424;--serif:Georgia,serif;--mono:"Courier New",monospace}
body{background:var(--bg);color:var(--fg);font:16px/1.7 system-ui,sans-serif;overflow-x:hidden}
.w{max-width:1100px;margin:0 auto;padding:0 28px}
header{border-bottom:1px solid var(--line)}
header .w{display:flex;justify-content:space-between;align-items:center;height:64px}
.logo{font:28px var(--serif);letter-spacing:.04em}.logo small{display:block;font:10px var(--mono);letter-spacing:.24em;color:var(--red)}
.tick{font:11px var(--mono);letter-spacing:.14em;color:var(--dim)}.tick i{display:inline-block;width:8px;height:8px;background:var(--red);margin-right:10px;animation:b 1s steps(2) infinite}
@keyframes b{50%{opacity:0}}
.num{font:clamp(56px,13vw,150px)/1 var(--mono);letter-spacing:.06em;color:#1d1d1d;padding-top:44px;user-select:none}
.num b{display:block;font:11px var(--mono);letter-spacing:.24em;color:var(--red);margin-bottom:10px}
h1{font:400 clamp(30px,5vw,56px)/1.12 var(--serif);max-width:820px;margin:14px 0 22px}
.sub{color:#9a968c;max-width:560px;margin-bottom:34px}
#gw{position:relative;height:560px;border:1px solid var(--line);background:#000}
#globe{position:absolute;inset:0}
.cesium-widget-credits{font-size:10px}
.tag{position:absolute;left:0;top:0;background:var(--red);color:#fff;font:11px var(--mono);letter-spacing:.14em;padding:7px 12px;z-index:3}
.hint{position:absolute;right:12px;top:12px;font:10px var(--mono);letter-spacing:.14em;color:var(--dim);z-index:3}
.grid{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-top:0}
.grid div{padding:30px 24px;border-right:1px solid var(--line)}.grid div:last-child{border:0}
.grid b{display:block;font:400 clamp(34px,5vw,56px)/1 var(--serif);color:var(--red);margin-bottom:8px}
.grid span{font-size:13px;color:var(--dim)}
.brief{display:grid;grid-template-columns:150px 1fr;gap:30px;padding:54px 0;border-bottom:1px solid var(--line)}
.brief h2{font:11px var(--mono);letter-spacing:.22em;color:var(--dim);font-weight:400}
.brief p{color:#a9a59b;max-width:640px;margin-bottom:16px}
.act{display:flex;gap:14px;flex-wrap:wrap;padding:34px 0 60px}
.act button,.act a{font:12px var(--mono);letter-spacing:.18em;padding:16px 28px;border:1px solid var(--fg);background:none;color:var(--fg);cursor:pointer;text-decoration:none}
.act .p{background:var(--red);border-color:var(--red);color:#fff}.act button:hover,.act a:hover{background:var(--fg);color:var(--bg)}.act .p:hover{background:#fff;color:var(--red)}
footer{border-top:1px solid var(--line);padding:16px 0;font:11px var(--mono);letter-spacing:.12em;color:var(--dim)}
#msg{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--fg);color:var(--bg);font:12px var(--mono);padding:12px 20px;display:none;z-index:9}
@media(max-width:700px){.grid{grid-template-columns:1fr}.grid div{border:0;border-bottom:1px solid var(--line)}.brief{grid-template-columns:1fr;gap:10px}#gw{height:380px}}
</style></head><body>
<header><div class="w"><div class="logo">ONE<small>ONECRISIS.EARTH</small></div><div class="tick"><i></i>NEXT IN <span id="cd">00:00:00</span></div></div></header>
<main class="w">
<div class="num"><b>CRISIS ON RECORD</b>#<span id="n"></span></div>
<h1 id="h"></h1><p class="sub" id="s"></p>
<div id="gw"><div class="tag" id="tag"></div><div class="hint">DRAG TO TURN / SCROLL TO ZOOM</div><div id="globe"></div></div>
<div class="grid"><div><b id="a"></b><span id="an"></span></div><div><b id="d"></b><span id="dn"></span></div><div><b id="y"></b><span id="yn"></span></div></div>
<section class="brief"><h2>THE BRIEF</h2><div id="br"></div></section>
<div class="act"><button class="p" id="sh">SHARE THIS CRISIS</button><a id="x" target="_blank" rel="noopener">POST ON X</a></div>
</main>
<footer><div class="w">ONE CRISIS. EVERY DAY. FOR EVERYONE ON EARTH.</div></footer>
<div id="msg">Copied. Now send it.</div>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.124.0/Build/Cesium/Cesium.js"></script>
<script>
window.ONE_CONFIG = {
  // Optional: free Cesium ion token for the 3D photoreal globe. Empty = Esri satellite globe.
  ionToken: "",
  site: "https://onecrisis.earth",
  crisis: {
    number: "0000001",
    place: "EL FASHER, NORTH DARFUR, SUDAN",
    lat: 13.63, lon: 25.35,
    headline: "Millions of people in Sudan have lost their homes. The cameras are gone.",
    sub: "Since April 2023 the army and the Rapid Support Forces have been fighting across Sudan. Darfur has taken the worst of it. Hunger is severe and aid is blocked.",
    displaced: "11M+", displacedNote: "people displaced inside and outside Sudan",
    deaths: "150K+", deathsNote: "estimated deaths, figures disputed",
    since: "2023-04-15", sinceNote: "days of war",
    brief: [
      "Fighting between Sudan's army and the Rapid Support Forces began in April 2023. It has since become one of the largest displacement crises on earth.",
      "Darfur is the centre of it. Food is running out, hospitals have been hit, and aid convoys struggle to get through.",
      "Coverage was heavy for a few weeks, then the news moved on. The people did not."
    ],
    share: "Right now millions of people in Sudan are displaced and starving. The world moved on. Don't."
  }
};
</script>
<script>
const C=ONE_CONFIG,K=C.crisis,$=i=>document.getElementById(i);
$('n').textContent=K.number;$('h').textContent=K.headline;$('s').textContent=K.sub;$('tag').textContent=K.place;
$('a').textContent=K.displaced;$('an').textContent=K.displacedNote;$('d').textContent=K.deaths;$('dn').textContent=K.deathsNote;
$('y').textContent=Math.floor((Date.now()-new Date(K.since))/864e5).toLocaleString();$('yn').textContent=K.sinceNote;
$('br').innerHTML=K.brief.map(t=>'<p>'+t+'</p>').join('');
setInterval(function(){const n=new Date,m=Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate()+1)-n;
$('cd').textContent=[m/36e5,m%36e5/6e4,m%6e4/1e3].map(v=>String(Math.floor(v)).padStart(2,'0')).join(':')},1000);
const txt=K.share+' '+C.site;
$('x').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(txt);
$('sh').onclick=async function(){try{if(navigator.share){await navigator.share({text:txt});return}
await navigator.clipboard.writeText(txt)}catch(e){const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}
$('msg').style.display='block';setTimeout(()=>$('msg').style.display='none',2500)};
(async function(){
try{
if(/claudeusercontent|claude\.ai/.test(location.hostname)){document.getElementById('globe').innerHTML='<p style="padding:24px;font:12px/1.8 monospace;color:#9a968c">The preview window blocks the 3D engine. Open this on your Cloudflare link to see the globe.</p>';return}
const o={animation:false,timeline:false,baseLayerPicker:false,geocoder:false,homeButton:false,sceneModePicker:false,navigationHelpButton:false,fullscreenButton:false,infoBox:false,selectionIndicator:false,baseLayer:false};
const v=new Cesium.Viewer('globe',o);
v.imageryLayers.addImageryProvider(await Cesium.TileMapServiceImageryProvider.fromUrl(Cesium.buildModuleUrl('Assets/Textures/NaturalEarthII')));
v.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',maximumLevel:19,credit:'Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community'}));
v.scene.globe.enableLighting=false;
const p=Cesium.Cartesian3.fromDegrees(K.lon,K.lat,0);
v.entities.add({polyline:{positions:[p,Cesium.Cartesian3.fromDegrees(K.lon,K.lat,650000)],width:3,material:Cesium.Color.fromCssColorString('#e2231a')}});
v.camera.setView({destination:Cesium.Cartesian3.fromDegrees(K.lon,K.lat-10,22000000)});
v.camera.flyToBoundingSphere(new Cesium.BoundingSphere(p,0),{offset:new Cesium.HeadingPitchRange(0,Cesium.Math.toRadians(-60),4500000),duration:8});
}catch(e){console.error(e);document.getElementById('globe').innerHTML='<p style="padding:20px;font:12px monospace;color:#6b6b6b">Globe failed to load. Refresh the page.</p>'}
})();
</script></body></html>
