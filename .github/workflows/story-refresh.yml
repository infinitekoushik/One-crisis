name: story-refresh
on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node story-audit.mjs
      - run: gh issue create --title "Story refresh $(date -u +%Y-%m)" --body-file story-audit.md
        env:
          GH_TOKEN: ${{ github.token }}
