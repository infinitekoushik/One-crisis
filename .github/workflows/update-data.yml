name: update-data
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --no-save playwright@1.55.0
        continue-on-error: true
      - run: npx playwright install --with-deps chromium
        continue-on-error: true
      - run: node build-data.mjs
      - run: |
          git config user.name "one-bot"
          git config user.email "bot@onecrisis.earth"
          git add data.json
          git diff --cached --quiet || (git commit -m "daily data" && git push)
