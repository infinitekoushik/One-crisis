name: update-data
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build-data.mjs
      - run: |
          git config user.name "one-bot"
          git config user.email "bot@onecrisis.earth"
          git add data.json
          git diff --cached --quiet || (git commit -m "daily data" && git push)
